<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="/favicon.ico"/>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#202945"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cartera UdeG</title>
  <script>
    /* Keep in sync with APP_THEME_IDS / APP_THEME_STORAGE_KEY in src/themes/appTheme.ts */
    (function () {
      var themeIds = ['default', 'west-coast', 'udg']
      var stored
      try { stored = localStorage.getItem('fw-theme') } catch (_) {}
      document.documentElement.dataset.theme =
        themeIds.indexOf(stored) !== -1 ? stored : 'udg'
    })()
  </script>
  <style>
    /* Initial loading shell — painted instantly, before the app JS parses.
       main.tsx removes #initial-loader once React has mounted. */
    #initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      background: #f4f7fa;
      color: #202945;
      font-family: "Inter Variable", "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #initial-loader .initial-loader__brand {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }
    #initial-loader .initial-loader__spinner {
      width: 2.5rem;
      height: 2.5rem;
      border: 3px solid rgba(32, 41, 69, 0.15);
      border-top-color: #202945;
      border-radius: 50%;
      animation: initial-loader-spin 0.8s linear infinite;
    }
    @keyframes initial-loader-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-color-scheme: dark) {
      #initial-loader {
        background: #101820;
        color: #f7f7f7;
      }
      #initial-loader .initial-loader__spinner {
        border-color: rgba(247, 247, 247, 0.15);
        border-top-color: #9ccaff;
      }
    }
  </style>
</head>
<body>
<div id="root"></div>
<div id="initial-loader">
  <div class="initial-loader__brand">Cartera UdeG</div>
  <div class="initial-loader__spinner"></div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
