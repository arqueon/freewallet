# Static wallet: WAS is optional and, if enabled, reached by its public URL.
server {
  listen 8080;
  listen [::]:8080;
  server_tokens off;
  root /usr/share/nginx/html;
  gzip on;
  gzip_static on;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  # Inline script is the initial theme loader; inline styles support MUI.
  # wasm-unsafe-eval supports Argon2; blob workers support the QR scanner.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https:; worker-src 'self' blob:; frame-src https://authn.io; frame-ancestors 'self' https://authn.io; object-src 'none'; base-uri 'self'; form-action 'self'" always;

  # Inherit security headers in both locations. Cache policy uses expires,
  # avoiding add_header's inheritance reset in older nginx versions.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
